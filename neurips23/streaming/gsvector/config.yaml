msturing-30M-clustered:
  gsvector:
    docker-tag: neurips23-streaming-gsvector
    module: neurips23.streaming.gsvector.module
    constructor: Gsvector
    base-args: ["@metric"]
    run-groups:
      base:
        args: |
          [{"R":32,"L":100,"build_threads":2,"batch_rows":32768,"compact_runs":8}]
        query-args: |
          [{"search_l":200,"threads":4}]
  gsvector-tiered:
    docker-tag: neurips23-streaming-gsvector
    module: neurips23.streaming.gsvector.module
    constructor: Gsvector
    base-args: ["@metric"]
    run-groups:
      graph-runs:
        args: |
          [{"R":32,"L":100,"build_threads":2,"batch_rows":32768,"compact_runs":4,"min_run_rows":0,"compaction":"tiered"}]
        query-args: |
          [{"search_l":200,"threads":4}]
  gsvector-tiered-wide:
    docker-tag: neurips23-streaming-gsvector
    module: neurips23.streaming.gsvector.module
    constructor: Gsvector
    base-args: ["@metric"]
    run-groups:
      bounded-build:
        args: |
          [{"R":24,"L":64,"build_threads":8,"batch_rows":32768,"compact_runs":4,"min_run_rows":0,"compaction":"tiered"}]
        query-args: |
          [{"search_l":200,"threads":16}]
  gsvector-streaming-batched:
    docker-tag: neurips23-streaming-gsvector
    module: neurips23.streaming.gsvector.module
    constructor: Gsvector
    base-args: ["@metric"]
    run-groups:
      experimental:
        args: |
          [{"R":24,"L":64,"build_threads":8,"batch_rows":1000000,"compact_runs":4,"min_run_rows":0,"compaction":"tiered"}]
        query-args: |
          [{"search_l":200,"threads":4,"reuse_connections":true}]
  gsvector-streaming-bounded:
    docker-tag: neurips23-streaming-gsvector
    module: neurips23.streaming.gsvector.module
    constructor: Gsvector
    base-args: ["@metric"]
    run-groups:
      experimental:
        args: |
          [{"R":24,"L":64,"build_threads":8,"batch_rows":1000000,"compact_runs":4,"min_run_rows":0,"compaction":"tiered","compact_max_rows":500000}]
        query-args: |
          [{"search_l":200,"threads":4,"reuse_connections":true,"fed_run_pool_max":64}]
  gsvector-streaming-fast-build:
    docker-tag: neurips23-streaming-gsvector
    module: neurips23.streaming.gsvector.module
    constructor: Gsvector
    base-args: ["@metric"]
    run-groups:
      experimental-bestfirst-codeoff:
        args: |
          [{"R":24,"L":64,"build_threads":8,"batch_rows":1000000,"compact_runs":4,"min_run_rows":0,"compaction":"tiered","compact_max_rows":500000,"build_beam_first":true,"build_neighbor_codes":false}]
        query-args: |
          [{"search_l":200,"threads":4,"reuse_connections":true,"fed_run_pool_max":64}]
  gsvector-streaming-bounded-io:
    docker-tag: neurips23-streaming-gsvector
    module: neurips23.streaming.gsvector.module
    constructor: Gsvector
    base-args: ["@metric"]
    run-groups:
      experimental-bounded-io:
        args: |
          [{"R":24,"L":64,"build_threads":8,"batch_rows":1000000,"compact_runs":4,"min_run_rows":0,"compaction":"tiered","compact_max_rows":500000}]
        query-args: |
          [{"search_l":200,"threads":4,"reuse_connections":true,"fed_run_pool_max":256,"random_io":true}]
  gsvector-resource-baseline:
    docker-tag: neurips23-streaming-gsvector
    module: neurips23.streaming.gsvector.module
    constructor: Gsvector
    base-args:
    - '@metric'
    run-groups:
      resource-diagnostic:
        args: '[{"R": 24, "L": 64, "build_threads": 32, "batch_rows": 1000000, "compact_runs":
          4, "min_run_rows": 0, "compaction": "tiered", "compact_max_rows": 500000}]'
        query-args: '[{"search_l": 200, "threads": 32, "reuse_connections": true, "fed_run_pool_max":
          64}]'
  gsvector-resource-reclaim:
    docker-tag: neurips23-streaming-gsvector
    module: neurips23.streaming.gsvector.module
    constructor: Gsvector
    base-args:
    - '@metric'
    run-groups:
      resource-diagnostic:
        args: '[{"R": 24, "L": 64, "build_threads": 32, "batch_rows": 1000000, "compact_runs":
          4, "min_run_rows": 0, "compaction": "tiered", "compact_max_rows": 4000000,
          "reclaim_max_rows": 12000000, "reclaim_max_runs": 2, "reclaim_cooldown": 8,
          "reclaim_min_dead": 10000, "reclaim_min_dead_fraction": 0.2}]'
        query-args: '[{"search_l": 200, "threads": 32, "reuse_connections": true, "fed_run_pool_max":
          64}]'
  gsvector-resource-cachewide:
    docker-tag: neurips23-streaming-gsvector
    module: neurips23.streaming.gsvector.module
    constructor: Gsvector
    base-args:
    - '@metric'
    run-groups:
      resource-diagnostic:
        args: '[{"R": 24, "L": 64, "build_threads": 32, "batch_rows": 1000000, "compact_runs":
          4, "min_run_rows": 0, "compaction": "tiered", "compact_max_rows": 500000}]'
        query-args: '[{"search_l": 200, "threads": 32, "reuse_connections": true, "fed_run_pool_max":
          256}]'
