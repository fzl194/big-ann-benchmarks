any:
  gsvector:
    docker-tag: vector-competition/gsvector-benchmark:release-20261026
    module: neurips23.ood.gsvector.module
    constructor: GsvectorOOD
    base-args: ["@metric"]
    run-groups:
      native-ip:
        args: |
          [{"R":32,"L":100,"build_threads":2,"batch_rows":32768}]
        query-args: |
          [{"search_l":200,"threads":4}]
  gsvector-resource-wide:
    docker-tag: vector-competition/gsvector-benchmark:release-20261026
    module: neurips23.ood.gsvector.module
    constructor: GsvectorOOD
    base-args:
    - '@metric'
    run-groups:
      native-ip:
        args: '[{"R": 32, "L": 100, "build_threads": 32, "batch_rows": 32768}]'
        query-args: '[{"search_l": 200, "threads": 32}]'
